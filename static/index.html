<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CLIPVAULT MEDIA ENGINE</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CLIPVAULT MEDIA ENGINE</h1>
            <div id="status-badge" class="badge ready">● READY</div>
        </header>

        <div id="ffmpeg-banner" class="banner hidden"></div>

        <div class="grid">
            <div class="card">
                <h2>INPUT</h2>
                <label>Input Folder:</label>
                <input type="text" id="input-dir" value="input" readonly>
            </div>
            <div class="card">
                <h2>TEMPLATE</h2>
                <select id="template-select">
                    <option value="streamer_jumpscare_v1">STREAMER JUMPSCARE V1</option>
                </select>
            </div>
            <div class="card">
                <h2>JUMPSCARE</h2>
                <label>Image Path:</label>
                <input type="text" id="image-path" value="assets/jumpscare.png">
                <label>Position (%):</label>
                <input type="number" id="position" value="50" min="0" max="100" step="1">
                <label>Duration (sec):</label>
                <input type="number" id="duration" value="0.5" min="0.1" step="0.1">
            </div>
            <div class="card">
                <h2>OUTPUT</h2>
                <label>Resolution:</label>
                <div class="resolution-group">
                    <input type="number" id="width" value="1080"> <span>x</span> <input type="number" id="height" value="1920">
                </div>
                <label>Naming Prefix:</label>
                <input type="text" id="naming" value="edit_final_">
            </div>
        </div>

        <div class="actions">
            <button id="process-btn" class="btn-primary">PROCESS ALL</button>
        </div>

        <div id="job-panel" class="card hidden">
            <h2>JOB STATUS</h2>
            <div id="progress-bar-container"><div id="progress-bar"></div></div>
            <div id="progress-text">0 / 0 completed</div>
            <ul id="task-list"></ul>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
